<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('新增课程')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-lesson-add">
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label is-required">课程标题：</label>
                    <div class="col-sm-8">
                        <input name="title" class="form-control" type="text" required>
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">课程封面图片：</label>
                    <div class="col-sm-8">
                        <input name="coverImg" class="form-control" type="hidden">
                        <div class="image-upload">
                            <img id="previewImage" style="max-width: 200px; max-height: 200px; display: none;">
                            <input type="file" name="file" id="imageInput" accept="image/*" style="display: none;">
                            <a class="btn btn-success btn-xs" onclick="$('#imageInput').click()"><i class="fa fa-upload"></i> 上传图片</a>
                            <a class="btn btn-primary btn-xs" onclick="generateAIImage()"><i class="fa fa-magic"></i> AI生成图片</a>
                            <a class="btn btn-danger btn-xs" onclick="clearImage()" style="display: none;" id="clearBtn"><i class="fa fa-trash"></i> 清除图片</a>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">课程描述：</label>
                    <div class="col-sm-8">
                        <textarea name="description" class="form-control"></textarea>
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">课程分类：</label>
                    <div class="col-sm-8">
                        <input name="category" class="form-control" type="text">
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">课程标签(逗号分隔)：</label>
                    <div class="col-sm-8">
                        <input name="tags" class="form-control" type="text">
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">排序：</label>
                    <div class="col-sm-8">
                        <input name="sort" class="form-control" type="text">
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">备注：</label>
                    <div class="col-sm-8">
                        <textarea name="remark" class="form-control"></textarea>
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">课程视频：</label>
                    <div class="col-sm-8">
                        <input name="videoUrl" class="form-control" type="hidden">
                        <div class="video-upload">
                            <video id="previewVideo" style="max-width: 400px; display: none;" controls></video>
                            <input type="file" name="videoFile" id="videoInput" accept="video/*" style="display: none;">
                            <a class="btn btn-success btn-xs" onclick="$('#videoInput').click()"><i class="fa fa-upload"></i> 上传视频</a>
                            <a class="btn btn-danger btn-xs" onclick="clearVideo()" style="display: none;" id="clearVideoBtn"><i class="fa fa-trash"></i> 清除视频</a>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var prefix = ctx + "lesson"
        
        $(function() {
            $("#form-lesson-add").validate({
                focusCleanup: true
            });

            // 图片上传处理
            $("#imageInput").change(function() {
                var file = this.files[0];
                if (!file) return;
                
                var formData = new FormData();
                formData.append("file", file);
                
                $.ajax({
                    url: ctx + "common/upload/image/lesson",
                    type: 'POST',
                    data: formData,
                    processData: false,
                    contentType: false,
                    success: function(response) {
                        if (response.code == 0) {
                            $("#previewImage").attr("src", response.data).show();
                            $("input[name='coverImg']").val(response.data);
                            $("#clearBtn").show();
                            $.modal.msgSuccess("上传成功");
                        } else {
                            $.modal.msgError(response.msg);
                        }
                    }
                });
            });

            // 视频上传处理
            $("#videoInput").change(function() {
                var file = this.files[0];
                if (!file) return;
                
                var formData = new FormData();
                formData.append("file", file);
                
                $.ajax({
                    url: ctx + "common/upload/video/lesson",
                    type: 'POST',
                    data: formData,
                    processData: false,
                    contentType: false,
                    success: function(response) {
                        if (response.code == 0) {
                            $("#previewVideo").attr("src", response.data).show();
                            $("input[name='videoUrl']").val(response.data);
                            $("#clearVideoBtn").show();
                            $.modal.msgSuccess("上传成功");
                        } else {
                            $.modal.msgError(response.msg);
                        }
                    }
                });
            });
        });

        function clearImage() {
            $("#previewImage").attr("src", "").hide();
            $("input[name='coverImg']").val("");
            $("#imageInput").val("");
            $("#clearBtn").hide();
        }

        function clearVideo() {
            $("#previewVideo").attr("src", "").hide();
            $("input[name='videoUrl']").val("");
            $("#videoInput").val("");
            $("#clearVideoBtn").hide();
        }

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/add", $('#form-lesson-add').serialize());
            }
        }

        function generateAIImage() {
            var title = $("input[name='title']").val();
            if (!title) {
                $.modal.msgError("请先输入课程标题");
                return;
            }
            
            $.modal.loading("正在生成图片，请稍候...");
            $.ajax({
                url: ctx + "ttl/generate/image/lesson",
                type: "POST",
                data: {
                    title: title
                },
                success: function(response) {
                    if (response.code == 0 && response.data) {
                        $("#previewImage").attr("src", response.data).show();
                        $("input[name='coverImg']").val(response.data);
                        $("#clearBtn").show();
                        $.modal.msgSuccess("图片生成成功");
                    } else {
                        $.modal.msgError(response.msg || "图片生成失败");
                    }
                },
                error: function() {
                    $.modal.msgError("图片生成请求失败");
                },
                complete: function() {
                    $.modal.closeLoading();
                }
            });
        }
    </script>
</body>
</html>
