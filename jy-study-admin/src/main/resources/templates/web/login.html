<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet"/>
    <link th:href="@{/css/font-awesome.min.css}" rel="stylesheet"/>
    <link th:href="@{/ajax/libs/layer/css/layer.css}" rel="stylesheet"/>
    <style>
        body {
            background: linear-gradient(135deg, rgba(30, 144, 255, 0.7) 0%, rgba(0, 0, 128, 0.7) 100%);
            margin: 0;
            font-family: "Microsoft YaHei", sans-serif;
        }
        .login-container {
            display: flex;
            min-height: 100vh;
            padding: 20px;
        }
        .login-box {
            display: flex;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.2);
            margin: auto;
            width: 1000px;
            overflow: hidden;
        }
        .login-form-side {
            padding: 40px;
            width: 400px;
            background: white;
        }
        .illustration-side {
            flex: 1;
            background: linear-gradient(135deg, rgba(33, 150, 243, 0.70) 0%, rgba(25, 118, 210, 0.70) 100%);
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            color: white;
            position: relative;
            overflow: hidden;
        }
        .illustration-side::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url([[${#servletContext.contextPath}]]/img/login-bg.png) no-repeat center center;
            background-size: cover;
            opacity: 0.1;
        }
        .form-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 30px;
            color: #333;
        }
        .form-control {
            height: 45px;
            border-radius: 6px;
            border: 1px solid #ddd;
            padding: 10px 15px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }
        .form-control:focus {
            border-color: #2196F3;
            box-shadow: 0 0 0 2px rgba(33, 150, 243, 0.2);
        }
        .btn-login {
            height: 45px;
            border-radius: 6px;
            background: #2196F3;
            border: none;
            color: white;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn-login:hover {
            background: #1976D2;
            transform: translateY(-1px);
        }
        .illustration-content {
            position: relative;
            z-index: 1;
        }
        .illustration-title {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .illustration-text {
            font-size: 16px;
            opacity: 0.9;
            line-height: 1.6;
        }
        .captcha-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .captcha-input {
            flex: 1;
        }
        .captcha-img {
            height: 45px;
            border-radius: 6px;
            cursor: pointer;
        }
        .register-link {
            text-align: center;
            margin-top: 20px;
        }
        .register-link a {
            color: #2196F3;
            text-decoration: none;
        }
        .register-link a:hover {
            text-decoration: underline;
        }
        .remember-me {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }
        .remember-me input[type="checkbox"] {
            margin-right: 8px;
        }
        .remember-me label {
            color: #666;
            font-weight: normal;
            margin: 0;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-form-side">
                <div class="form-title">用户登录</div>
                <form id="loginForm">
                    <input type="text" class="form-control" name="username" placeholder="用户名">
                    <input type="password" class="form-control" name="password" placeholder="密码">
                    <div class="captcha-group" th:if="${captchaEnabled}">
                        <input type="text" class="form-control captcha-input" name="validateCode" placeholder="验证码" maxlength="5">
                        <img class="captcha-img imgcode" th:src="@{/captcha/captchaImage(type=math)}">
                    </div>
                    <div class="remember-me">
                        <input type="checkbox" id="rememberMe" name="rememberMe" checked>
                        <label for="rememberMe">记住我</label>
                    </div>
                    <button type="submit" class="btn btn-login btn-block">登录</button>
                    <div class="register-link">
                        <a th:href="@{/web/register}">还没有账号？立即注册</a>
                    </div>
                </form>
            </div>
            <div class="illustration-side">
                <div class="illustration-content">

                    <div class="illustration-title">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-graduation-cap h-10 w-10 text-blue-600"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"></path><path d="M22 10v6"></path><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"></path></svg>
                        在线学习平台</div>
                    <div class="illustration-text">
                        欢迎使用我们的在线学习平台<br>
                        这里有丰富的课程资源和学习工具<br>
                        让我们一起开启学习之旅
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script th:src="@{/js/jquery.min.js}"></script>
    <script th:src="@{/js/bootstrap.min.js}"></script>
    <script th:src="@{/ajax/libs/flot/jquery.flot.js}"></script>
    <script th:src="@{/ajax/libs/layer/layer.min.js}"></script>

    <script th:inline="javascript">
    $(function() {
        var ctx = [[${#servletContext.contextPath}]];

        // 错误提示
        function showError(message) {
            layer.msg(message, {
                icon: 2,
                time: 2000,
                shade: [0.3, '#000']
            });
        }

        // 成功提示
        function showSuccess(message) {
            layer.msg(message, {
                icon: 1,
                time: 1000,
                shade: [0.3, '#000']
            });
        }

        $('.imgcode').click(function() {
            var url = ctx + "/captcha/captchaImage?type=math&s=" + Math.random();
            $(this).attr("src", url);
        });

        $("#loginForm").on("submit", function(e) {
            e.preventDefault();
            
            // 表单验证
            var username = $("input[name='username']").val().trim();
            var password = $("input[name='password']").val().trim();
            var rememberMe = $("input[name='rememberMe']").prop("checked");
            
            if (username === '') {
                showError('请输入用户名');
                return false;
            }
            if (password === '') {
                showError('请输入密码');
                return false;
            }
            
            // 如果开启了验证码，检查验证码
            var validateCode = $("input[name='validateCode']");
            if (validateCode.length > 0 && validateCode.val().trim() === '') {
                showError('请输入验证码');
                return false;
            }

            var loadingIndex = layer.load(2, {
                shade: [0.3, '#fff']
            });

            $.ajax({
                type: "POST",
                url: ctx + "/web/login",
                data: {
                    username: username,
                    password: password,
                    rememberMe: rememberMe,
                    validateCode: validateCode.length > 0 ? validateCode.val() : ''
                },
                dataType: "json",
                success: function(res) {
                    layer.close(loadingIndex);
                    if(res.code == 0) {
                        showSuccess('登录成功');
                        setTimeout(function() {
                            location.href = ctx + "/web";
                        }, 1000);
                    } else {

                        showError(res.msg || '登录失败');
                        // 刷新验证码
                        if(validateCode.length > 0) {
                            $('.imgcode').click();
                        }
                        // 如果是验证码错误，清空验证码输入框
                        if(res.msg && res.msg.indexOf('验证码') !== -1) {
                            validateCode.val('');
                        }
                        // 如果是密码错误，清空密码输入框
                        if(res.msg && res.msg.indexOf('密码') !== -1) {
                            $("input[name='password']").val('');
                        }
                    }
                },
                error: function(xhr) {
                    layer.close(loadingIndex);
                    // 修改错误处理逻辑
                    var errorMsg = '';
                    try {
                        var response = xhr.responseJSON;
                        errorMsg = response ? (response.msg || response.message || '登录失败') : '登录失败';
                    } catch(e) {
                        errorMsg = '登录请求失败，请稍后重试';
                    }
                    showError(errorMsg);
                    
                    // 刷新验证码
                    if(validateCode.length > 0) {
                        $('.imgcode').click();
                    }
                }
            });
        });
    });
    </script>
</body>
</html>
