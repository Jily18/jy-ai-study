<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章分类 - 课程学习平台</title>
    <link href="/css/bootstrap-v4/bootstrap.min.css" rel="stylesheet">
    <link href="/css/font-awesome.min.css" rel="stylesheet">
    <link href="/css/web-common.css" rel="stylesheet"/>
    <style>
        .category-container {
            padding: 40px 0;
            min-height: calc(100vh - 300px);
        }

        /* 调整container宽度 */
        @media (min-width: 1200px) {
            .container {
                max-width: 1320px;  /* 默认是1140px，增加约10% */
            }
        }

        /* 左侧分类列表样式 */
        .category-list {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 10px rgba(0,0,0,.05);
            padding: 20px 0;
            width: 250px;  /* 固定分类列表宽度 */
        }

        .category-item {
            padding: 12px 25px;
            cursor: pointer;
            color: #495057;
            transition: all 0.3s;
            border-left: 3px solid transparent;
        }

        .category-item:hover {
            background-color: #f8f9fa;
            color: #2196F3;
        }

        .category-item.active {
            background-color: #e3f2fd;
            color: #2196F3;
            border-left-color: #2196F3;
        }

        /* 右侧文章列表样式 */
        .article-container {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 10px rgba(0,0,0,.05);
            padding: 20px;
        }

        .search-box {
            margin-bottom: 20px;
            display: flex;
            justify-content: flex-end;
            max-width: 300px;
            margin-left: auto;
        }

        .search-input {
            border-radius: 20px 0 0 20px;
            padding: 10px 20px;
            border: 1px solid #dee2e6;
            border-right: none;
            box-shadow: 0 2px 5px rgba(0,0,0,.05);
        }

        .search-btn {
            border-radius: 0 20px 20px 0;
            border: 1px solid #007bff;
            background: #007bff;
            color: white;
            padding: 0 20px;
            transition: all 0.3s;
        }

        .search-btn:hover {
            background: #0056b3;
            border-color: #0056b3;
        }

        .article-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);  /* 固定3列 */
            gap: 20px;
            margin-top: 20px;
        }

        .article-card {
            border: none;
            transition: transform .2s;
            box-shadow: 0 2px 10px rgba(0,0,0,.05);
            border-radius: 8px;
            overflow: hidden;
            width: 100%;  /* 确保卡片填充整个网格单元格 */
        }

        .article-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(0,0,0,.1);
        }

        .article-card .card-img-top {
            height: 160px;
            object-fit: cover;
        }

        .article-card .card-body {
            padding: 20px;
        }

        .article-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: #343a40;
            height: 48px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .article-meta {
            color: #6c757d;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .article-meta span {
            margin-right: 15px;
        }

        .article-tags {
            margin-bottom: 15px;
        }

        .article-tags .badge {
            margin-right: 5px;
            padding: 5px 10px;
            border-radius: 15px;
        }

        .pagination {
            margin-top: 30px;
        }

        .page-link {
            border: none;
            color: #495057;
            margin: 0 5px;
            border-radius: 4px;
            transition: all 0.3s;
        }

        .page-link:hover {
            background-color: #e3f2fd;
            color: #2196F3;
        }

        .page-item.active .page-link {
            background-color: #2196F3;
            border-color: #2196F3;
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <div th:replace="~{web/fragments/navbar :: navbar}"></div>

    <!-- 主体内容 -->
    <div class="category-container">
        <div class="container">
            <div class="row">
                <!-- 左侧分类列表 -->
                <div class="col-md-auto">
                    <div class="category-list">
                        <div class="category-item active" data-id="0">
                            全部文章
                        </div>
                        <div th:each="category : ${categories}" 
                             th:class="'category-item'" 
                             th:data-id="${category.categoryId}"
                             th:text="${category.name}">
                            分类名称
                        </div>
                    </div>
                </div>

                <!-- 右侧文章列表 -->
                <div class="col-md">
                    <div class="article-container">
                        <!-- 搜索框 -->
                        <div class="search-box">
                            <input type="text" class="form-control search-input" id="searchInput" placeholder="搜索文章...">
                            <button class="btn search-btn" onclick="searchArticles()">
                                <i class="fa fa-search"></i>
                            </button>
                        </div>

                        <!-- 文章网格 -->
                        <div class="article-grid">
                            <div th:each="article : ${articles}" class="article-card card">
                                <img th:if="${article.coverImg}" th:src="${article.coverImg}" 
                                     class="card-img-top" alt="文章封面">
                                <div class="card-body">
                                    <h5 class="article-title" th:text="${article.title}">文章标题</h5>
                                    <div class="article-meta">
                                        <span><i class="fa fa-eye"></i> <span th:text="${article.viewCount}">0</span></span>
                                        <span><i class="fa fa-thumbs-up"></i> <span th:text="${article.likeCount}">0</span></span>
                                        <span><i class="fa fa-bookmark"></i> <span th:text="${article.collectCount}">0</span></span>
                                    </div>
                                    <div class="article-tags">
                                        <span class="badge badge-primary" th:text="${article.categoryName}">分类</span>
                                        <span class="badge badge-info" 
                                              th:each="tag : ${#strings.arraySplit(article.tags, ',')}" 
                                              th:text="${tag}">标签</span>
                                    </div>
                                    <a th:href="@{'/web/article/' + ${article.articleId}}" 
                                       class="btn btn-primary btn-sm btn-block">
                                        开始阅读 <i class="fa fa-arrow-right ml-1"></i>
                                    </a>
                                </div>
                            </div>
                        </div>

                        <!-- 分页 -->
                        <nav>
                            <ul class="pagination justify-content-center">
                                <li class="page-item" th:class="${pageNum <= 1} ? 'disabled page-item' : 'page-item'">
                                    <a class="page-link" href="#" th:onclick="'changePage(' + ${pageNum - 1} + ')'">
                                        <i class="fa fa-angle-left"></i>
                                    </a>
                                </li>
                                <li class="page-item" th:each="i : ${#numbers.sequence(1, totalPages)}"
                                    th:class="${i == pageNum} ? 'active page-item' : 'page-item'">
                                    <a class="page-link" href="#" th:text="${i}" 
                                       th:onclick="'changePage(' + ${i} + ')'">1</a>
                                </li>
                                <li class="page-item" 
                                    th:class="${pageNum >= totalPages} ? 'disabled page-item' : 'page-item'">
                                    <a class="page-link" href="#" th:onclick="'changePage(' + ${pageNum + 1} + ')'">
                                        <i class="fa fa-angle-right"></i>
                                    </a>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="footer bg-dark text-white">
        <div class="container text-center">
            <p>© 2024 课程学习平台. All rights reserved.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script th:src="@{/js/jquery.min.js}"></script>
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
    <script>
        var ctx = /*[[@{/}]]*/'';
        let currentCategoryId = 0;
        let currentKeyword = '';

        $(function() {
            // 分类点击事件
            $('.category-item').click(function() {
                $('.category-item').removeClass('active');
                $(this).addClass('active');
                currentCategoryId = $(this).data('id');
                loadArticles(1);
            });

            // 搜索框输入事件
            let searchTimer;
            $('#searchInput').on('input', function() {
                clearTimeout(searchTimer);
                searchTimer = setTimeout(() => {
                    currentKeyword = $(this).val();
                    loadArticles(1);
                }, 500);
            });

            // 搜索框回车事件
            $('#searchInput').on('keypress', function(e) {
                if(e.which === 13) {
                    searchArticles();
                }
            });
        });

        function loadArticles(pageNum) {
            $.ajax({
                url: ctx + 'articleList',
                type: 'POST',
                data: {
                    pageNum: pageNum,
                    categoryId: currentCategoryId,
                    keyword: currentKeyword
                },
                success: function(res) {
                    if(res.code === 0) {
                        updateArticleList(res.data.articles);
                        updateArticlePagination(res.data.pageNum, res.data.totalPages);
                    }
                }
            });
        }

        function updateArticleList(articles) {
            let html = '';
            articles.forEach(article => {
                html += `
                    <div class="article-card card">
                        <img src="${article.coverImg || '/img/default-article.png'}" 
                             class="card-img-top" alt="文章封面">
                        <div class="card-body">
                            <h5 class="article-title">${article.title}</h5>
                            <div class="article-meta">
                                <span><i class="fa fa-eye"></i> ${article.viewCount}</span>
                                <span><i class="fa fa-thumbs-up"></i> ${article.likeCount}</span>
                                <span><i class="fa fa-bookmark"></i> ${article.collectCount}</span>
                            </div>
                            <div class="article-tags">
                                <span class="badge badge-primary">${article.categoryName}</span>
                                ${article.tags.split(',').map(tag => 
                                    `<span class="badge badge-info">${tag}</span>`).join('')}
                            </div>
                            <a href="/web/article/${article.articleId}" 
                               class="btn btn-primary btn-sm btn-block">
                                开始阅读 <i class="fa fa-arrow-right ml-1"></i>
                            </a>
                        </div>
                    </div>
                `;
            });
            $('.article-grid').html(html);
        }

        function updateArticlePagination(pageNum, totalPages) {
            let html = `
                <li class="page-item ${pageNum <= 1 ? 'disabled' : ''}">
                    <a class="page-link" href="#" onclick="changePage(${pageNum - 1})">
                        <i class="fa fa-angle-left"></i>
                    </a>
                </li>
            `;
            
            for(let i = 1; i <= totalPages; i++) {
                html += `
                    <li class="page-item ${i === pageNum ? 'active' : ''}">
                        <a class="page-link" href="#" onclick="changePage(${i})">${i}</a>
                    </li>
                `;
            }
            
            html += `
                <li class="page-item ${pageNum >= totalPages ? 'disabled' : ''}">
                    <a class="page-link" href="#" onclick="changePage(${pageNum + 1})">
                        <i class="fa fa-angle-right"></i>
                    </a>
                </li>
            `;
            
            $('.pagination').html(html);
        }

        function changePage(pageNum) {
            loadArticles(pageNum);
        }

        function searchArticles() {
            currentKeyword = $('#searchInput').val();
            loadArticles(1);
        }
    </script>
</body>
</html>
