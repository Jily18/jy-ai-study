<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课程学习平台</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/4.5.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        .navbar {
            box-shadow: 0 2px 4px rgba(0,0,0,.08);
        }
        .jumbotron {
            background: linear-gradient(45deg, #6c757d, #343a40);
            color: white;
            padding: 100px 0;
            margin-bottom: 0;
        }
        .article-card {
            border: none;
            transition: transform .2s;
            margin-bottom: 30px;
            box-shadow: 0 2px 10px rgba(0,0,0,.05);
        }
        .article-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(0,0,0,.1);
        }
        .card-body {
            padding: 25px;
        }
        .article-meta {
            color: #6c757d;
            font-size: 0.9rem;
        }
        .article-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 10px 0;
            color: #343a40;
        }
        .article-desc {
            color: #6c757d;
            margin-bottom: 15px;
            height: 48px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .btn-read {
            background: #343a40;
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            transition: all .2s;
        }
        .btn-read:hover {
            background: #6c757d;
            color: white;
            text-decoration: none;
        }
        .footer {
            background: #343a40;
            color: white;
            padding: 40px 0;
            margin-top: 50px;
        }
        .search-box {
            max-width: 600px;
            margin: 30px auto;
        }
        .search-input {
            border-radius: 20px;
            padding: 20px;
            border: none;
            box-shadow: 0 2px 10px rgba(0,0,0,.1);
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" th:href="@{/web}">课程学习平台</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item active">
                        <a class="nav-link" th:href="@{/web}"><i class="fa fa-home"></i> 首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/web/category}"><i class="fa fa-th-list"></i> 课程分类</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/web/featured}"><i class="fa fa-star"></i> 精选推荐</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 头部横幅 -->
    <div class="jumbotron text-center">
        <div class="container">
            <h1 class="display-4">开启你的学习之旅</h1>
            <p class="lead">海量优质课程，助你成长</p>
            <div class="search-box">
                <input type="text" class="form-control search-input" placeholder="搜索课程或文章...">
            </div>
        </div>
    </div>

    <!-- 文章列表 -->
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-4" th:each="article : ${articles}">
                <div class="card article-card">
                    <div class="card-body">
                        <div class="article-meta">
                            <i class="fa fa-user"></i> <span th:text="${article.createBy}">作者</span>
                            <i class="fa fa-clock-o ml-2"></i> <span th:text="${#dates.format(article.createTime, 'yyyy-MM-dd')}">日期</span>
                        </div>
                        <h5 class="article-title" th:text="${article.title}">文章标题</h5>
                        <p class="article-desc" th:text="${article.remark}">文章描述...</p>
                        <a th:href="@{'/web/article/' + ${article.articleId}}" class="btn btn-read">
                            阅读全文 <i class="fa fa-arrow-right ml-1"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- 分页 -->
        <nav class="mt-4">
            <ul class="pagination justify-content-center">
                <li class="page-item">
                    <a class="page-link" href="#"><i class="fa fa-angle-left"></i></a>
                </li>
                <li class="page-item active"><a class="page-link" href="#">1</a></li>
                <li class="page-item"><a class="page-link" href="#">2</a></li>
                <li class="page-item"><a class="page-link" href="#">3</a></li>
                <li class="page-item">
                    <a class="page-link" href="#"><i class="fa fa-angle-right"></i></a>
                </li>
            </ul>
        </nav>
    </div>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="container text-center">
            <p>© 2024 课程学习平台. All rights reserved.</p>
            <div class="mt-3">
                <a href="#" class="text-white mx-2"><i class="fa fa-weixin fa-lg"></i></a>
                <a href="#" class="text-white mx-2"><i class="fa fa-qq fa-lg"></i></a>
                <a href="#" class="text-white mx-2"><i class="fa fa-weibo fa-lg"></i></a>
            </div>
        </div>
    </footer>

    <script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/4.5.3/js/bootstrap.bundle.min.js"></script>
    <script>
        $(function() {
            // 搜索功能
            $('.search-input').on('keyup', function(e) {
                if(e.keyCode === 13) {
                    var keyword = $(this).val();
                    if(keyword) {
                        window.location.href = ctx + "web/search?keyword=" + encodeURIComponent(keyword);
                    }
                }
            });
        });
    </script>
</body>
</html>
