<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${article.title} + ' - 课程学习平台'">文章标题</title>
    <link href="/css/bootstrap-v4/bootstrap.min.css" rel="stylesheet">
    <link href="/css/font-awesome.min.css" rel="stylesheet">
    <link th:href="@{/css/animate.min.css}" rel="stylesheet"/>
    <link th:href="@{/css/style.min.css}" rel="stylesheet"/>
    <link th:href="@{/ruoyi/css/ry-ui.css}" rel="stylesheet"/>
    <link th:href="@{/css/web-common.css}" rel="stylesheet"/>
    <style>
        .article-header {
            background: linear-gradient(45deg, #6c757d, #343a40);
            color: white;
            padding: 60px 0;
        }
        .article-cover {
            width: 100%;
            max-width: 300px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,.2);
        }
        .article-title {
            font-size: 2rem;
            margin: 20px 0;
        }
        .article-meta {
            color: #dee2e6;
            margin-bottom: 20px;
        }
        .article-meta span {
            margin-right: 20px;
        }
        .article-tags .badge {
            margin-right: 8px;
            padding: 8px 15px;
            font-size: 0.9rem;
        }
        .article-content {
            padding: 40px 0;
        }
        .article-description {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #495057;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 10px rgba(0,0,0,.05);
        }
        .article-actions {
            margin: 30px 0;
        }
        .btn-action {
            margin-right: 15px;
            padding: 10px 25px;
            border-radius: 25px;
            font-weight: 500;
            transition: all 0.3s;
        }
        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,.1);
        }
        .btn-action.active {
            background-color: #007bff;
            color: white;
        }
        .footer {
            background: #343a40;
            color: white;
            padding: 40px 0;
            margin-top: 50px;
        }
        body {
            background-color: #f8f9fa;
            font-family: "Microsoft YaHei", sans-serif;
        }
        .navbar {
            box-shadow: 0 2px 4px rgba(0,0,0,.08);
        }
        .btn-like, .btn-collect {
            padding: 10px 30px;
            border-radius: 25px;
            transition: all .3s ease;
            border: 2px solid;
            background: transparent;
            font-weight: 500;
        }
        
        .btn-like {
            color: #28a745;
            border-color: #28a745;
        }
        
        .btn-like:hover {
            background: rgba(40, 167, 69, 0.1);
            color: #28a745;
        }
        
        .btn-like.active {
            background: #28a745;
            color: white;
            border-color: #28a745;
        }
        
        .btn-collect {
            color: #5b73e8;
            border-color: #5b73e8;
        }
        
        .btn-collect:hover {
            background: rgba(91, 115, 232, 0.1);
            color: #5b73e8;
        }

        .btn-collect.active {
            background: #5b73e8;
            color: white;
            border-color: #5b73e8;
        }

        .btn-like i, .btn-collect i {
            margin-right: 5px;
        }

        .btn-like.active i, .btn-collect.active i {
            animation: bounce 0.5s;
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .analyzing {
            font-family: monospace;
            white-space: pre-wrap;
            line-height: 1.5;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 5px;
            border-left: 4px solid #007bff;
        }
        
        .analysis-content {
            min-height: 100px;
            line-height: 1.6;
            font-size: 1.1rem;
        }
        
        .analysis-content.loading {
            position: relative;
        }
        
        .analysis-content.loading:after {
            content: "正在分析中...";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #6c757d;
        }

        /* 添加新的布局样式 */
        .content-wrapper {
            display: flex;
            position: relative;
            min-height: calc(100vh - 400px); /* 减去header和footer的高度 */
        }
        
        .article-content {
            width: 75%;
            transition: width 0.3s ease;
            padding: 40px 20px 40px 40px;
        }
        
        .article-content.expanded {
            width: 95%;
        }
        
        .ai-sidebar {
            width: 25%;
            position: fixed;
            border-radius: 5px;
            right: 0;
            top: 60%;
            transform: translateY(-50%);  /* 恢复垂直居中 */
            height: 84vh;  /* 恢复原来的高度 */
            transition: all 0.3s ease;
            background: white;
            box-shadow: -2px 0 10px rgba(0,0,0,0.1);
            z-index: 1000;
            display: flex;
        }
        
        .ai-sidebar.collapsed {
            width: 40px;
            right: 0;
        }
        
        /* 保留美化后的折叠按钮样式 */
        .ai-toggle {
            position: absolute;
            left: -32px;
            top: 50%;
            transform: translateY(-50%);
            width: 32px;
            height: 80px;
            background: linear-gradient(135deg, #71b2f9, #4b93e3);
            border: none;
            border-radius: 6px 0 0 6px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            font-size: 16px;
            box-shadow: -2px 0 8px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }
        
        .ai-toggle:hover {
            background: linear-gradient(135deg, #71b2f9, #4b93e3);
            width: 36px;
            left: -36px;
        }
        
        .ai-toggle i {
            transition: transform 0.3s ease;
        }
        
        .ai-toggle:hover i {
            transform: scale(1.2);
        }

        /* 调整内容区域样式 */
        .ai-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            width: 100%;
        }
        
        .ai-content.hidden {
            display: none;
        }
        
        /* 调整卡片样式以适应新的布局 */
        .article-ai-analysis {
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .article-ai-analysis .card {
            flex: 1;
            display: flex;
            flex-direction: column;
            margin: 0;
            border-radius: 8px;
            background: #fff;
            border: 1px solid rgba(0,0,0,0.1);
        }

        .article-ai-analysis .card-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .article-ai-analysis .card-header {
            padding: 5px 20px;
            background: #f8f9fa;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            border-radius: 8px 8px 0 0;
        }

        /* 优化按钮样式 */
        .article-ai-analysis .btn-primary {
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .article-ai-analysis .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .btn-voice {
            padding: 10px 30px;
            border-radius: 25px;
            transition: all .3s ease;
            border: 2px solid;
            background: transparent;
            font-weight: 500;
            color: #17a2b8;
            border-color: #17a2b8;
        }
        
        .btn-voice:hover {
            background: rgba(23, 162, 184, 0.1);
            color: #17a2b8;
        }
        
        .btn-voice.active {
            background: #17a2b8;
            color: white;
            border-color: #17a2b8;
        }
        
        .btn-voice i {
            margin-right: 5px;
        }
        
        .btn-voice.loading {
            cursor: wait;
        }

        /* 试题预览样式 */
        .questions-preview {
            margin-top: 40px;
            padding: 30px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 10px rgba(0,0,0,.05);
        }
        .questions-preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #e9ecef;
        }
        .questions-preview-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: #343a40;
        }
        .questions-preview-content {
            margin-bottom: 20px;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            position: relative;
        }
        .preview-text {
            color: #495057;
            line-height: 1.6;
            font-size: 1rem;
            white-space: pre-wrap;
            position: relative;
        }
        .preview-text::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 40px;
            background: linear-gradient(transparent, #f8f9fa);
            pointer-events: none;
        }
        .view-all-questions {
            text-align: center;
            margin-top: 20px;
        }
        .btn-view-all {
            padding: 10px 30px;
            border-radius: 25px;
            background-color: #007bff;
            color: white;
            border: none;
            transition: all 0.3s;
        }
        .btn-view-all:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,.1);
        }
    </style>
</head>
<body>
    <!-- 基础JS依赖 -->
    <script th:src="@{/js/jquery.min.js}"></script>
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/common.js}"></script>

    <!-- 定义ctx变量 -->
    <script th:inline="javascript">
        var ctx = /*[[@{/}]]*/'';
        var prefix = ctx + "web/interaction";
        window.isAuthenticated = [[${@shiroService.getPrincipal() != null}]];
        var articleVoiceUrl = /*[[${article.voiceUrl}]]*/ null;
    </script>
    
    <!-- 其他JS依赖 -->
    <script th:src="@{/ajax/libs/layer/layer.min.js}"></script>
    <script th:src="@{/ruoyi/js/common.js}"></script>
    <script th:src="@{/ruoyi/js/ry-ui.js}"></script>
    <!-- 使用th:replace引入导航栏 -->
    <div th:replace="web/fragments/navbar :: navbar"></div>

    <!-- 文章头部 -->
    <div class="article-header">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-4">
                    <img th:if="${article.coverImg}" th:src="${article.coverImg}" class="article-cover" alt="文章封面">
<!--                    假如没有图片-->
                    <img th:if="${article.coverImg == null}" th:src="@{/img/default-article.png}" class="article-cover" alt="默认封面">
                </div>
                <div class="col-md-8">
                    <h1 class="article-title" th:text="${article.title}">文章标题</h1>
                    <div class="article-meta">
                        <span><i class="fa fa-user"></i> <span th:text="${article.createBy}">作者</span></span>
                        <span><i class="fa fa-clock-o"></i> <span th:text="${#dates.format(article.createTime, 'yyyy-MM-dd')}">日期</span></span>
                        <span><i class="fa fa-eye"></i> <span th:text="${article.viewCount}">0</span> 次浏览</span>
                    </div>
                    <div class="article-tags">
                        <span class="badge badge-primary" th:text="${article.categoryName}">分类</span>
                        <span class="badge badge-info" th:if="${article.tags != null}" th:each="tag : ${#strings.arraySplit(article.tags, ',')}" th:text="${tag}">标签</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 修改文章内容和AI分析的布局结构 -->
    <!-- 将原来的文章内容和AI分析部分替换为以下结构 -->
    <div class="content-wrapper">
        <!-- 文章内容 -->
        <div class="article-content">
            <div class="container">
                <div class="article-description" th:utext="${article.content}">
                    文章内容...
                </div>
                <!-- 试题预览 -->
                <div class="questions-preview" th:if="${aiCoze != null}">
                    <div class="questions-preview-header">
                        <div class="questions-preview-title">
                            <i class="fa fa-question-circle"></i> 相关试题
                        </div>
                        <div class="questions-count">
                            共 <span th:text="${aiCoze.questionNum}">0</span> 道题目
                        </div>
                    </div>
                    <div class="questions-preview-content">
                        <div class="preview-text" th:text="${previewContent}">
                            题目预览内容...
                        </div>
                    </div>
                    <div class="view-all-questions">
                        <button class="btn btn-view-all" onclick="viewAllQuestions()">
                            <i class="fa fa-list-alt"></i> 查看全部试题
                        </button>
                    </div>
                </div>
                <div class="article-actions text-center mb-4">
                    <button class="btn btn-like mr-3" onclick="toggleLike()" id="likeBtn">
                        <i class="fa fa-thumbs-up"></i> 点赞 <span id="likeCount" th:text="${article.likeCount}">0</span>
                    </button>
                    <button class="btn btn-collect mr-3" onclick="toggleCollect()" id="collectBtn">
                        <i class="fa fa-star"></i> 收藏 <span id="collectCount" th:text="${article.collectCount}">0</span>
                    </button>
                    <button class="btn btn-voice" id="voiceBtn" onclick="toggleVoice()">
                        <i class="fa fa-volume-up"></i> AI朗读
                    </button>
                </div>
            </div>
        </div>

        <!-- AI分析侧边栏 -->
        <div class="ai-sidebar" id="aiSidebar">
            <button class="ai-toggle" onclick="toggleAiSidebar()" id="aiToggle">
                <i class="fa fa-angle-left"></i>
            </button>
            <div class="ai-content" id="aiContent">
                <div class="article-ai-analysis">
                    <div class="card">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <h5 class="mb-0">AI文章解析</h5>
                            <button class="btn btn-primary btn-sm" onclick="analyzeArticle()" id="analyzeBtn">
                                <i class="fa fa-robot"></i> 开始解析
                            </button>
                        </div>
                        <div class="card-body">
                            <div id="analysisResult" class="analysis-content">
                                <!-- AI分析结果将在这里显示 -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="footer bg-dark text-white py-4">
        <div class="container text-center">
            <p>© 2024 课程学习平台. All rights reserved.</p>
        </div>
    </footer>

    <audio id="voicePlayer" style="display: none;"></audio>

    <script>
    var isLiked = false;
    var isCollected = false;

    $(function() {
        // 获取当前用户的点赞和收藏状态
        $.ajax({
            url: prefix + "/status",
            type: "GET",
            data: {
                type: "2",
                targetId: [[${article.articleId}]]
            },
            success: function(res) {
                if (res.code == 0) {
                    isLiked = res.data.liked;
                    isCollected = res.data.collected;
                    updateButtonStatus();
                }
            },
            error: function(xhr, status, error) {
                console.log("获取状态失败：" + error);
            }
        });

    });

    function toggleLike() {
        if (!isLiked) {
            handleLike("2", [[${article.articleId}]], function() {
                isLiked = true;
                $("#likeCount").text(parseInt($("#likeCount").text()) + 1);
                updateButtonStatus();
            });
        } else {
            handleUnlike("2", [[${article.articleId}]], function() {
                isLiked = false;
                $("#likeCount").text(parseInt($("#likeCount").text()) - 1);
                updateButtonStatus();
            });
        }
    }

    function toggleCollect() {
        if (!isCollected) {
            handleCollect("2", [[${article.articleId}]], function() {
                isCollected = true;
                $("#collectCount").text(parseInt($("#collectCount").text()) + 1);
                updateButtonStatus();
            });
        } else {
            handleUncollect("2", [[${article.articleId}]], function() {
                isCollected = false;
                $("#collectCount").text(parseInt($("#collectCount").text()) - 1);
                updateButtonStatus();
            });
        }
    }

    function updateButtonStatus() {
        if (isLiked) {
            $("#likeBtn").addClass("active");
            $("#likeBtn").html('<i class="fa fa-thumbs-up"></i> 已赞 <span id="likeCount">' + $("#likeCount").text() + '</span>');
        } else {
            $("#likeBtn").removeClass("active");
            $("#likeBtn").html('<i class="fa fa-thumbs-up"></i> 点赞 <span id="likeCount">' + $("#likeCount").text() + '</span>');
        }
        if (isCollected) {
            $("#collectBtn").addClass("active");
            $("#collectBtn").html('<i class="fa fa-star"></i> 已收藏 <span id="collectCount">' + $("#collectCount").text() + '</span>');
        } else {
            $("#collectBtn").removeClass("active");
            $("#collectBtn").html('<i class="fa fa-star"></i> 收藏 <span id="collectCount">' + $("#collectCount").text() + '</span>');
        }
    }

    // 记录浏览量
    $(function() {
        $.ajax({
            url: prefix + "/view",
            type: "POST",
            data: {
                type: "2",
                targetId: [[${article.articleId}]]
            },
            success: function(res) {
                if (res.code != 0) {
                    console.log("浏览量记录失败：" + res.msg);
                }
            },
            error: function(xhr, status, error) {
                console.log("浏览量记录请求失败：" + error);
            }
        });
    });

    function analyzeArticle() {
        // 如果需要登录，直接返回
        if(handleLoginRequired()) {
            return;
        }
        
        const analyzeBtn = $("#analyzeBtn");
        const resultDiv = $("#analysisResult");
        
        // 禁用按钮
        analyzeBtn.prop('disabled', true);
        analyzeBtn.html('<i class="fa fa-spinner fa-spin"></i> 分析中...');
        
        // 清空并显示加载状态
        resultDiv.empty().addClass('loading');
        
        // 创建EventSource
        const source = new EventSource(ctx + "llm/analyze/" + [[${article.articleId}]]);
        let content = '';
        
        // 监听消息
        source.onmessage = function(event) {
            content += event.data;
            
            // 实时显示原始文本
            resultDiv.removeClass('loading')
                .html('<div class="analyzing">' + content + '</div>');
        };
        
        // 监听连接打开
        source.onopen = function(event) {
            console.log("SSE连接已建立");
        };
        
        // 监听错误
        source.onerror = function(event) {
            console.error("SSE错误:", event);
            source.close();
            // 转换markdown为HTML
            $.get(ctx + "llm/markdownToHtml", {id: [[${article.articleId}]]}, function(result) {
                if(result) {
                    // 最终显示markdown转换后的HTML
                    resultDiv.removeClass('loading').html(result);
                } else {
                    resultDiv.removeClass('loading').html('<div class="alert alert-danger">分析失败，请稍后重试</div>');
                }
                // 恢复按钮状态
                analyzeBtn.prop('disabled', false);
                analyzeBtn.html('<i class="fa fa-robot"></i> 重新解析');
            });
        };
    }

    // 添加侧边栏切换功能
    function toggleAiSidebar() {
        const sidebar = document.getElementById('aiSidebar');
        const content = document.getElementById('aiContent');
        const toggle = document.getElementById('aiToggle');
        const mainContent = document.querySelector('.article-content');
        
        if (sidebar.classList.contains('collapsed')) {
            // 展开
            sidebar.classList.remove('collapsed');
            content.classList.remove('hidden');
            toggle.innerHTML = '<i class="fa fa-angle-left"></i>';
            mainContent.classList.remove('expanded');
        } else {
            // 折叠
            sidebar.classList.add('collapsed');
            content.classList.add('hidden');
            toggle.innerHTML = '<i class="fa fa-angle-right"></i>';
            mainContent.classList.add('expanded');
        }
    }

    function toggleVoice() {
        // 如果需要登录，直接返回
        if(handleLoginRequired()) {
            return;
        }
        
        const voiceBtn = $("#voiceBtn");
        const voicePlayer = $("#voicePlayer")[0];

        // 如果已经有音频在播放，则停止播放
        if(voicePlayer.src && !voicePlayer.paused) {
            voicePlayer.pause();
            voiceBtn.removeClass("active");
            voiceBtn.html('<i class="fa fa-volume-up"></i> AI朗读');
            return;
        }
        // 如果已经有语音URL，直接播放
        if (articleVoiceUrl) {
            playVoice(articleVoiceUrl);
            return;
        }
        // 否则生成新的语音
        voiceBtn.addClass("loading");
        voiceBtn.prop("disabled", true);
        voiceBtn.html('<i class="fa fa-spinner fa-spin"></i> 生成中...');
        $.ajax({
            url: ctx + "tts/generate/voice",
            type: "POST",
            data: {
                articleId: [[${article.articleId}]]
            },
            success: function(res) {
                if(res.code === 0) {
                    playVoice(res.data);
                } else {
                    $.modal.alertError("生成失败：" + res.msg);
                }
            },
            error: function() {
                $.modal.alertError("生成请求失败");
            },
            complete: function() {
                voiceBtn.removeClass("loading");
                voiceBtn.prop("disabled", false);
                voiceBtn.html('<i class="fa fa-volume-up"></i> AI朗读');
            }
        });

    }
    
    function playVoice(url) {
        const voiceBtn = $("#voiceBtn");
        const voicePlayer = $("#voicePlayer")[0];
        
        voicePlayer.src = url;
        voicePlayer.play();
        
        voiceBtn.addClass("active");
        voiceBtn.html('<i class="fa fa-pause"></i> 停止朗读');
        
        // 播放结束时重置按钮状态
        voicePlayer.onended = function() {
            voiceBtn.removeClass("active");
            voiceBtn.html('<i class="fa fa-volume-up"></i> AI朗读');
        };
    }

    function viewAllQuestions() {
        var url = ctx + "web/questions/" + [[${article.articleId}]];
        window.location.href = url;
    }
    </script>
</body>
</html>
