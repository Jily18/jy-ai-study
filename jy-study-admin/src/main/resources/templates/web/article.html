<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${article.title} + ' - 课程学习平台'">文章标题</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/4.5.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        .navbar {
            box-shadow: 0 2px 4px rgba(0,0,0,.08);
        }
        .article-header {
            padding: 60px 0;
            background: linear-gradient(45deg, #6c757d, #343a40);
            color: white;
        }
        .article-meta {
            color: #adb5bd;
            font-size: 0.9rem;
            margin: 20px 0;
        }
        .article-content {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #343a40;
            padding: 20px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 10px rgba(0,0,0,.05);
        }
        .article-content img {
            max-width: 100%;
            height: auto;
            margin: 20px auto;
            display: block;
        }
        .article-content p {
            margin-bottom: 1.5rem;
            text-align: justify;
        }
        .article-content h1,
        .article-content h2,
        .article-content h3,
        .article-content h4,
        .article-content h5,
        .article-content h6 {
            margin: 1.5rem 0 1rem;
            font-weight: 600;
        }
        .article-nav {
            margin: 50px 0;
            padding: 20px 0;
            border-top: 1px solid #dee2e6;
            border-bottom: 1px solid #dee2e6;
        }
        .article-nav a {
            color: #6c757d;
            text-decoration: none;
            transition: all .2s;
        }
        .article-nav a:hover {
            color: #343a40;
        }
        .footer {
            background: #343a40;
            color: white;
            padding: 40px 0;
            margin-top: 50px;
        }
        .btn-back {
            background: #343a40;
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            transition: all .2s;
            text-decoration: none;
        }
        .btn-back:hover {
            background: #6c757d;
            color: white;
            text-decoration: none;
        }
        .category-tag .badge {
            padding: 8px 15px;
            font-size: 0.9rem;
        }
        .article-summary {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 10px;
        }
        .btn-like, .btn-collect {
            padding: 10px 30px;
            border-radius: 25px;
            transition: all .2s;
            border: none;
        }
        .btn-like {
            background: #dc3545;
            color: white;
        }
        .btn-like:hover {
            background: #c82333;
        }
        .btn-collect {
            background: #ffc107;
            color: #343a40;
        }
        .btn-collect:hover {
            background: #e0a800;
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" th:href="@{/web}">课程学习平台</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/web}"><i class="fa fa-home"></i> 首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/web/category}"><i class="fa fa-th-list"></i> 课程分类</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/web/featured}"><i class="fa fa-star"></i> 精选推荐</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 文章头部 -->
    <header class="article-header">
        <div class="container">
            <div class="category-tag mb-2">
                <span class="badge badge-primary" th:text="${article.category == 'course' ? '课程文章' : '知识库文章'}">分类</span>
                <span class="badge badge-secondary ml-2" th:each="tag : ${#strings.arraySplit(article.tags, ',')}" th:text="${tag}">标签</span>
            </div>
            <h1 class="display-4" th:text="${article.title}">文章标题</h1>
            <div class="article-meta">
                <span><i class="fa fa-user"></i> <span th:text="${article.createBy}">作者</span></span>
                <span class="ml-3"><i class="fa fa-clock-o"></i> <span th:text="${#dates.format(article.createTime, 'yyyy-MM-dd HH:mm')}">发布时间</span></span>
                <span class="ml-3"><i class="fa fa-eye"></i> <span th:text="${article.viewCount}">阅读量</span></span>
                <span class="ml-3"><i class="fa fa-thumbs-up"></i> <span th:text="${article.likeCount}">点赞数</span></span>
                <span class="ml-3"><i class="fa fa-star"></i> <span th:text="${article.collectCount}">收藏数</span></span>
            </div>
            <div class="article-summary mt-3" th:if="${article.summary}">
                <p class="lead" th:text="${article.summary}">文章摘要</p>
            </div>
            <a th:href="@{/web}" class="btn-back"><i class="fa fa-arrow-left"></i> 返回首页</a>
        </div>
    </header>

    <!-- 文章内容 -->
    <div class="container my-5">
        <div class="row">
            <div class="col-lg-8 mx-auto">
                <div class="article-actions text-center mb-4">
                    <button class="btn btn-like mr-3" onclick="likeArticle()">
                        <i class="fa fa-thumbs-up"></i> 点赞 (<span id="likeCount" th:text="${article.likeCount}">0</span>)
                    </button>
                    <button class="btn btn-collect" onclick="collectArticle()">
                        <i class="fa fa-star"></i> 收藏 (<span id="collectCount" th:text="${article.collectCount}">0</span>)
                    </button>
                </div>
                <article class="article-content" th:utext="${article.content}">
                    文章内容
                </article>

                <!-- 文章导航 -->
                <div class="article-nav">
                    <div class="row">
                        <div class="col-6">
                            <i class="fa fa-angle-left"></i> 上一篇
                        </div>
                        <div class="col-6 text-right">
                            下一篇 <i class="fa fa-angle-right"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="container text-center">
            <p>© 2024 课程学习平台. All rights reserved.</p>
            <div class="mt-3">
                <a href="#" class="text-white mx-2"><i class="fa fa-weixin fa-lg"></i></a>
                <a href="#" class="text-white mx-2"><i class="fa fa-qq fa-lg"></i></a>
                <a href="#" class="text-white mx-2"><i class="fa fa-weibo fa-lg"></i></a>
            </div>
        </div>
    </footer>

    <script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/4.5.3/js/bootstrap.bundle.min.js"></script>
    <script>
    function likeArticle() {
        // 实现点赞功能
    }

    function collectArticle() {
        // 实现收藏功能
    }
    </script>
</body>
</html>
