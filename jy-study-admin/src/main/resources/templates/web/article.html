<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${article.title} + ' - 课程学习平台'">文章标题</title>
    <link href="/css/bootstrap-v4/bootstrap.min.css" rel="stylesheet">
    <link href="/css/font-awesome.min.css" rel="stylesheet">
    <link th:href="@{/css/animate.min.css}" rel="stylesheet"/>
    <link th:href="@{/css/style.min.css}" rel="stylesheet"/>
    <link th:href="@{/ruoyi/css/ry-ui.css}" rel="stylesheet"/>
    <link th:href="@{/css/web-common.css}" rel="stylesheet"/>
    <style>
        .article-header {
            background: linear-gradient(45deg, #6c757d, #343a40);
            color: white;
            padding: 60px 0;
        }
        .article-cover {
            width: 100%;
            max-width: 300px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,.2);
        }
        .article-title {
            font-size: 2rem;
            margin: 20px 0;
        }
        .article-meta {
            color: #dee2e6;
            margin-bottom: 20px;
        }
        .article-meta span {
            margin-right: 20px;
        }
        .article-tags .badge {
            margin-right: 8px;
            padding: 8px 15px;
            font-size: 0.9rem;
        }
        .article-content {
            padding: 40px 0;
        }
        .article-description {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #495057;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 10px rgba(0,0,0,.05);
        }
        .article-actions {
            margin: 30px 0;
        }
        .btn-action {
            margin-right: 15px;
            padding: 10px 25px;
            border-radius: 25px;
            font-weight: 500;
            transition: all 0.3s;
        }
        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,.1);
        }
        .btn-action.active {
            background-color: #007bff;
            color: white;
        }
        .footer {
            background: #343a40;
            color: white;
            padding: 40px 0;
            margin-top: 50px;
        }
        body {
            background-color: #f8f9fa;
            font-family: "Microsoft YaHei", sans-serif;
        }
        .navbar {
            box-shadow: 0 2px 4px rgba(0,0,0,.08);
        }
        .btn-like, .btn-collect {
            padding: 10px 30px;
            border-radius: 25px;
            transition: all .3s ease;
            border: 2px solid;
            background: transparent;
            font-weight: 500;
        }
        
        .btn-like {
            color: #28a745;
            border-color: #28a745;
        }
        
        .btn-like:hover {
            background: rgba(40, 167, 69, 0.1);
            color: #28a745;
        }
        
        .btn-like.active {
            background: #28a745;
            color: white;
            border-color: #28a745;
        }
        
        .btn-collect {
            color: #5b73e8;
            border-color: #5b73e8;
        }
        
        .btn-collect:hover {
            background: rgba(91, 115, 232, 0.1);
            color: #5b73e8;
        }

        .btn-collect.active {
            background: #5b73e8;
            color: white;
            border-color: #5b73e8;
        }

        .btn-like i, .btn-collect i {
            margin-right: 5px;
        }

        .btn-like.active i, .btn-collect.active i {
            animation: bounce 0.5s;
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
    </style>
</head>
<body>
    <!-- 基础JS依赖 -->
    <script th:src="@{/js/jquery.min.js}"></script>
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/common.js}"></script>

    <!-- 定义ctx变量 -->
    <script th:inline="javascript">
        var ctx = /*[[@{/}]]*/'';
        var prefix = ctx + "web/interaction";
        window.isAuthenticated = [[${@shiroService.getPrincipal() != null}]];
    </script>
    
    <!-- 其他JS依赖 -->
    <script th:src="@{/ajax/libs/layer/layer.min.js}"></script>
    <script th:src="@{/ruoyi/js/common.js}"></script>
    <script th:src="@{/ruoyi/js/ry-ui.js}"></script>

    <!-- 使用th:replace引入导航栏 -->
    <div th:replace="web/fragments/navbar :: navbar"></div>

    <!-- 文章头部 -->
    <div class="article-header">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-4">
                    <img th:if="${article.coverImg}" th:src="${article.coverImg}" class="article-cover" alt="文章封面">
<!--                    假如没有图片-->
                    <img th:if="${article.coverImg == null}" th:src="@{/img/default-article.png}" class="article-cover" alt="默认封面">
                </div>
                <div class="col-md-8">
                    <h1 class="article-title" th:text="${article.title}">文章标题</h1>
                    <div class="article-meta">
                        <span><i class="fa fa-eye"></i> <span th:text="${article.viewCount}">0</span> 次浏览</span>
                        <span><i class="fa fa-thumbs-up"></i> <span th:text="${article.likeCount}">0</span> 次点赞</span>
                        <span><i class="fa fa-bookmark"></i> <span th:text="${article.collectCount}">0</span> 次收藏</span>
                    </div>
                    <div class="article-tags">
                        <span class="badge badge-primary" th:text="${article.category == 'course' ? '课程文章' : '知识库文章'}">分类</span>
                        <span class="badge badge-info" th:if="${article.tags != null}" th:each="tag : ${#strings.arraySplit(article.tags, ',')}" th:text="${tag}">标签</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 文章内容 -->
    <div class="article-content">
        <div class="container">
            <div class="article-description" th:utext="${article.content}">
                文章内容...
            </div>
            <div class="article-actions text-center mb-4">
                <button class="btn btn-like mr-3" onclick="toggleLike()" id="likeBtn">
                    <i class="fa fa-thumbs-up"></i> 点赞 <span id="likeCount" th:text="${article.likeCount}">0</span>
                </button>
                <button class="btn btn-collect" onclick="toggleCollect()" id="collectBtn">
                    <i class="fa fa-star"></i> 收藏 <span id="collectCount" th:text="${article.collectCount}">0</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="footer bg-dark text-white py-4">
        <div class="container text-center">
            <p>© 2024 课程学习平台. All rights reserved.</p>
        </div>
    </footer>

    <script>
    var isLiked = false;
    var isCollected = false;

    $(function() {
        // 获取当前用户的点赞和收藏状态
        $.ajax({
            url: prefix + "/status",
            type: "GET",
            data: {
                type: "2",
                targetId: [[${article.articleId}]]
            },
            success: function(res) {
                if (res.code == 0) {
                    isLiked = res.data.liked;
                    isCollected = res.data.collected;
                    updateButtonStatus();
                }
            },
            error: function(xhr, status, error) {
                console.log("获取状态失败：" + error);
            }
        });
    });

    function toggleLike() {
        if (!isLiked) {
            handleLike("2", [[${article.articleId}]], function() {
                isLiked = true;
                $("#likeCount").text(parseInt($("#likeCount").text()) + 1);
                updateButtonStatus();
            });
        } else {
            handleUnlike("2", [[${article.articleId}]], function() {
                isLiked = false;
                $("#likeCount").text(parseInt($("#likeCount").text()) - 1);
                updateButtonStatus();
            });
        }
    }

    function toggleCollect() {
        if (!isCollected) {
            handleCollect("2", [[${article.articleId}]], function() {
                isCollected = true;
                $("#collectCount").text(parseInt($("#collectCount").text()) + 1);
                updateButtonStatus();
            });
        } else {
            handleUncollect("2", [[${article.articleId}]], function() {
                isCollected = false;
                $("#collectCount").text(parseInt($("#collectCount").text()) - 1);
                updateButtonStatus();
            });
        }
    }

    function updateButtonStatus() {
        if (isLiked) {
            $("#likeBtn").addClass("active");
            $("#likeBtn").html('<i class="fa fa-thumbs-up"></i> 已赞 <span id="likeCount">' + $("#likeCount").text() + '</span>');
        } else {
            $("#likeBtn").removeClass("active");
            $("#likeBtn").html('<i class="fa fa-thumbs-up"></i> 点赞 <span id="likeCount">' + $("#likeCount").text() + '</span>');
        }
        if (isCollected) {
            $("#collectBtn").addClass("active");
            $("#collectBtn").html('<i class="fa fa-star"></i> 已收藏 <span id="collectCount">' + $("#collectCount").text() + '</span>');
        } else {
            $("#collectBtn").removeClass("active");
            $("#collectBtn").html('<i class="fa fa-star"></i> 收藏 <span id="collectCount">' + $("#collectCount").text() + '</span>');
        }
    }

    // 记录浏览量
    $(function() {
        $.ajax({
            url: prefix + "/view",
            type: "POST",
            data: {
                type: "2",
                targetId: [[${article.articleId}]]
            },
            success: function(res) {
                if (res.code != 0) {
                    console.log("浏览量记录失败：" + res.msg);
                }
            },
            error: function(xhr, status, error) {
                console.log("浏览量记录请求失败：" + error);
            }
        });
    });
    </script>
</body>
</html>
