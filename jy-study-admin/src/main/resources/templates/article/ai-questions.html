<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('AI试题详情')" />
    <style>
        .question-content {
            white-space: pre-wrap;
            font-family: monospace;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 4px;
        }
    </style>
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <div class="row">
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="font-bold">题目总数：</label>
                    <p th:text="${aiCoze.questionNum}"></p>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="font-bold">生成时间：</label>
                    <p th:text="${#dates.format(aiCoze.createTime, 'yyyy-MM-dd HH:mm:ss')}"></p>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-sm-12">
                <div class="form-group">
                    <label class="font-bold">飞书文档：</label>
                    <a th:href="${aiCoze.fileUrl}" target="_blank" class="btn btn-primary btn-xs">
                        <i class="fa fa-external-link"></i> 查看文档
                    </a>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-sm-12">
                <div class="form-group">
                    <label class="font-bold">题目内容：</label>
                    <div class="question-content" th:text="${aiCoze.content}">
                    </div>
                </div>
            </div>
        </div>

    </div>
    <th:block th:include="include :: footer" />
</body>
</html>
