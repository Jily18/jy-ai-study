<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('文章详细')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-article-detail">
            <div class="form-group">    
                <label class="col-sm-3 control-label">文章标题：</label>
                <div class="col-sm-8">
                    <input type="text" class="form-control" th:value="${article.title}" readonly/>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">文章内容：</label>
                <div class="col-sm-8">
                    <div class="summernote" id="content" readonly>
                        <div th:utext="${article.content}"></div>
                    </div>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">排序：</label>
                <div class="col-sm-8">
                    <input type="text" class="form-control" th:value="${article.sort}" readonly/>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">状态：</label>
                <div class="col-sm-8">
                    <div class="radio-box" th:each="dict : ${@dict.getType('sys_normal_disable')}">
                        <input type="radio" th:id="${dict.dictCode}" th:value="${dict.dictValue}" th:field="${article.status}" disabled>
                        <label th:for="${dict.dictCode}" th:text="${dict.dictLabel}"></label>
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">创建者：</label>
                <div class="col-sm-8">
                    <input type="text" class="form-control" th:value="${article.createBy}" readonly/>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">创建时间：</label>
                <div class="col-sm-8">
                    <input type="text" class="form-control" th:value="${#dates.format(article.createTime, 'yyyy-MM-dd HH:mm:ss')}" readonly/>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">更新者：</label>
                <div class="col-sm-8">
                    <input type="text" class="form-control" th:value="${article.updateBy}" readonly/>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">更新时间：</label>
                <div class="col-sm-8">
                    <input type="text" class="form-control" th:value="${#dates.format(article.updateTime, 'yyyy-MM-dd HH:mm:ss')}" readonly/>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">备注：</label>
                <div class="col-sm-8">
                    <textarea class="form-control" rows="3" readonly>[[${article.remark}]]</textarea>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: summernote-js" />
    <script type="text/javascript">
        $(function() {
            $('.summernote').summernote({
                height : '220px',
                lang : 'zh-CN',
                toolbar: [],
                readOnly: true
            });
            // 移除summernote的编辑功能
            $('.note-editing-area').css('background-color', '#fff');
            $('.note-editing-area').find('*').attr('contenteditable', false);
        });
    </script>
</body>
</html>
