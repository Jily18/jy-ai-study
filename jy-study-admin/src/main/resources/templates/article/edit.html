<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
	<th:block th:include="include :: header('修改文章')" />
	<th:block th:include="include :: summernote-css" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-article-edit" th:object="${article}">
            <input id="articleId" name="articleId" th:field="*{articleId}" type="hidden">
            <div class="form-group">	
                <label class="col-sm-3 control-label is-required">文章标题：</label>
                <div class="col-sm-8">
                    <input id="title" name="title" th:field="*{title}" class="form-control" type="text" required>
                </div>
            </div>
            <div class="form-group">	
                <label class="col-sm-3 control-label is-required">文章内容：</label>
                <div class="col-sm-8">
                    <textarea id="content" name="content" class="form-control summernote" required>[[*{content}]]</textarea>
                </div>
            </div>
            <div class="form-group">	
                <label class="col-sm-3 control-label">排序：</label>
                <div class="col-sm-8">
                    <input id="sort" name="sort" th:field="*{sort}" class="form-control" type="number">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">状态：</label>
                <div class="col-sm-8">
                    <div class="radio-box" th:each="dict : ${@dict.getType('sys_normal_disable')}">
                        <input type="radio" th:id="${dict.dictCode}" name="status" th:value="${dict.dictValue}" th:field="*{status}">
                        <label th:for="${dict.dictCode}" th:text="${dict.dictLabel}"></label>
                    </div>
                </div>
            </div>
            <div class="form-group">	
                <label class="col-sm-3 control-label">文章分类：</label>
                <div class="col-sm-8">
                    <select name="category" class="form-control" th:field="*{category}">
                        <option value="course">课程文章</option>
                        <option value="knowledge">知识库文章</option>
                    </select>
                </div>
            </div>
            <div class="form-group">	
                <label class="col-sm-3 control-label">文章标签：</label>
                <div class="col-sm-8">
                    <input id="tags" name="tags" th:field="*{tags}" class="form-control" type="text" placeholder="多个标签用逗号分隔">
                </div>
            </div>
            <div class="form-group">	
                <label class="col-sm-3 control-label">文章摘要：</label>
                <div class="col-sm-8">
                    <textarea id="summary" name="summary" class="form-control" rows="3" th:field="*{summary}"></textarea>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">是否置顶：</label>
                <div class="col-sm-8">
                    <div class="radio-box">
                        <input type="radio" name="top" value="0" th:field="*{top}"> 否
                        <input type="radio" name="top" value="1" th:field="*{top}"> 是
                    </div>
                </div>
            </div>
            <div class="form-group">	
                <label class="col-sm-3 control-label">备注：</label>
                <div class="col-sm-8">
                    <textarea id="remark" name="remark" class="form-control" rows="3" th:field="*{remark}"></textarea>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: summernote-js" />
    <script type="text/javascript">
        var prefix = ctx + "article";
        
        $(function() {
            $('.summernote').summernote({
                height : '400px',
                lang : 'zh-CN',
                placeholder: '请输入文章内容',
                toolbar: [
                    ['style', ['style']],
                    ['font', ['bold', 'underline', 'clear']],
                    ['fontname', ['fontname']],
                    ['color', ['color']],
                    ['para', ['ul', 'ol', 'paragraph']],
                    ['table', ['table']],
                    ['insert', ['link', 'picture']],
                    ['view', ['fullscreen', 'codeview', 'help']]
                ],
                callbacks: {
                    onImageUpload: function(files) {
                        sendFile(files[0], this);
                    }
                }
            });
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/edit", $('#form-article-edit').serialize());
            }
        }
    </script>
</body>
</html>
