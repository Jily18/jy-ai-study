<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
	<th:block th:include="include :: header('修改文章')" />
	<th:block th:include="include :: summernote-css" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-article-edit" th:object="${article}">
            <input id="articleId" name="articleId" th:field="*{articleId}" type="hidden">
            <div class="form-group">	
                <label class="col-sm-3 control-label is-required">文章标题：</label>
                <div class="col-sm-8">
                    <input id="title" name="title" th:field="*{title}" class="form-control" type="text" required>
                </div>
            </div>
            <div class="form-group">	
                <label class="col-sm-3 control-label is-required">文章内容：</label>
                <div class="col-sm-8">
                    <textarea id="content" name="content" class="form-control summernote" required>[[*{content}]]</textarea>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">文章封面图片：</label>
                <div class="col-sm-8">
                    <input name="coverImg" th:field="*{coverImg}" class="form-control" type="hidden">
                    <div class="image-upload">
                        <img id="previewImage" th:src="*{coverImg}" style="max-width: 200px; max-height: 200px;" th:style="*{coverImg != null && coverImg != ''} ? 'max-width: 200px; max-height: 200px;' : 'display: none;'">
                        <input type="file" name="file" id="imageInput" accept="image/*" style="display: none;">
                        <a class="btn btn-success btn-xs" onclick="$('#imageInput').click()"><i class="fa fa-upload"></i> 上传图片</a>
                        <a class="btn btn-primary btn-xs" onclick="generateAIImage()"><i class="fa fa-magic"></i> AI生成图片</a>
                        <a class="btn btn-danger btn-xs" onclick="clearImage()" th:style="*{coverImg != null && coverImg != ''} ? '' : 'display: none;'" id="clearBtn"><i class="fa fa-trash"></i> 清除图片</a>
                    </div>
                </div>
            </div>
            <div class="form-group">	
                <label class="col-sm-3 control-label">排序：</label>
                <div class="col-sm-8">
                    <input id="sort" name="sort" th:field="*{sort}" class="form-control" type="number">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">状态：</label>
                <div class="col-sm-8">
                    <div class="radio-box" th:each="dict : ${@dict.getType('sys_normal_disable')}">
                        <input type="radio" th:id="${dict.dictCode}" name="status" th:value="${dict.dictValue}" th:field="*{status}">
                        <label th:for="${dict.dictCode}" th:text="${dict.dictLabel}"></label>
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">文章分类：</label>
                <div class="col-sm-8">
                    <input name="categoryId" type="hidden" th:field="*{categoryId}">
                    <input name="categoryName" type="hidden" th:field="*{categoryName}" class="form-control" readonly>
                    <div class="input-group">
                        <select id="categorySelect" class="form-control">
                            <option value="">请选择分类</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="form-group">	
                <label class="col-sm-3 control-label">文章标签：</label>
                <div class="col-sm-8">
                    <input id="tags" name="tags" th:field="*{tags}" class="form-control" type="text" placeholder="多个标签用逗号分隔">
                </div>
            </div>
            <div class="form-group">	
                <label class="col-sm-3 control-label">文章摘要：</label>
                <div class="col-sm-8">
                    <textarea id="summary" name="summary" class="form-control" rows="3" th:field="*{summary}"></textarea>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">是否置顶：</label>
                <div class="col-sm-8">
                    <div class="radio-box">
                        <input type="radio" name="top" value="0" th:field="*{top}"> 否
                        <input type="radio" name="top" value="1" th:field="*{top}"> 是
                    </div>
                </div>
            </div>
            <div class="form-group">	
                <label class="col-sm-3 control-label">备注：</label>
                <div class="col-sm-8">
                    <textarea id="remark" name="remark" class="form-control" rows="3" th:field="*{remark}"></textarea>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: summernote-js" />
    <script type="text/javascript">
        var prefix = ctx + "article";
        
        $(function() {
            $('.summernote').summernote({
                height : '400px',
                lang : 'zh-CN',
                placeholder: '请输入文章内容',
                toolbar: [
                    ['style', ['style']],
                    ['font', ['bold', 'underline', 'clear']],
                    ['fontname', ['fontname']],
                    ['color', ['color']],
                    ['para', ['ul', 'ol', 'paragraph']],
                    ['table', ['table']],
                    ['insert', ['link', 'picture']],
                    ['view', ['fullscreen', 'codeview', 'help']]
                ],
                callbacks: {
                    onImageUpload: function(files) {
                        sendFile(files[0], this);
                    }
                }
            });

            // 图片上传处理
            $("#imageInput").change(function() {
                var file = this.files[0];
                if (!file) return;
                
                var formData = new FormData();
                formData.append("file", file);
                
                $.ajax({
                    url: ctx + "common/upload/image/article",
                    type: 'POST',
                    data: formData,
                    processData: false,
                    contentType: false,
                    success: function(response) {
                        if (response.code == 0) {
                            $("#previewImage").attr("src", response.data).show();
                            $("input[name='coverImg']").val(response.data);
                            $("#clearBtn").show();
                            $.modal.msgSuccess("上传成功");
                        } else {
                            $.modal.msgError(response.msg);
                        }
                    }
                });
            });

            // 加载分类列表
            $.ajax({
                url: ctx + "article/category/list",
                type: "post",
                dataType: "json",
                success: function(res) {
                    if (res.rows && res.rows.length > 0) {
                        var html = '<option value="">请选择分类</option>';
                        var currentCategoryId = $("input[name='categoryId']").val();
                        $.each(res.rows, function(i, item) {
                            if (item.status == '0') { // 只显示正常状态的分类
                                var selected = item.categoryId == currentCategoryId ? 'selected' : '';
                                html += '<option value="' + item.categoryId + '" data-name="' + item.name + '" ' + selected + '>' + item.name + '</option>';
                            }
                        });
                        $("#categorySelect").html(html);
                    }
                }
            });

            // 分类选择事件
            $("#categorySelect").change(function() {
                var $selected = $(this).find("option:selected");
                $("input[name='categoryId']").val($selected.val());
                $("input[name='categoryName']").val($selected.data("name"));
            });
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/edit", $('#form-article-edit').serialize());
            }
        }

        function clearImage() {
            $("#previewImage").attr("src", "").hide();
            $("input[name='coverImg']").val("");
            $("#imageInput").val("");
            $("#clearBtn").hide();
        }

        function generateAIImage() {
            var title = $("#title").val();
            if (!title) {
                $.modal.msgError("请先输入文章标题");
                return;
            }
            
            $.modal.loading("正在生成图片，请稍候...");
            $.ajax({
                url: ctx + "ttl/generate/image/article",
                type: "POST",
                data: {
                    title: title
                },
                success: function(response) {
                    if (response.code == 0 && response.data) {
                        $("#previewImage").attr("src", response.data).show();
                        $("input[name='coverImg']").val(response.data);
                        $("#clearBtn").show();
                        $.modal.msgSuccess("图片生成成功");
                    } else {
                        $.modal.msgError(response.msg || "图片生成失败");
                    }
                },
                error: function() {
                    $.modal.msgError("图片生成请求失败");
                },
                complete: function() {
                    $.modal.closeLoading();
                }
            });
        }
    </script>
</body>
</html>
